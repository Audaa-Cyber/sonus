name: Verify Sonus redesign

on:
  push:
    branches:
      - redesign/fern-flower-experience
  pull_request:
    branches:
      - redesign/fern-flower-experience

concurrency:
  group: sonus-redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
