name: Sonus checks

on:
  push:
    branches:
      - main
      - redesign/dark-signal-landing
  pull_request:
    branches:
      - main

concurrency:
  group: sonus-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
